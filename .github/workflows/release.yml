name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/curso-devops-api:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/curso-devops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    environment:
      name: production
    steps:
      - name: Trigger Render deploy hook with the released image tag
        run: |
          curl -fsS -G "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --data-urlencode "imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/curso-devops-api:${{ github.ref_name }}"
